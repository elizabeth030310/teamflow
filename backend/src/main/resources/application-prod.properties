spring.datasource.url=jdbc:postgresql://${TEAMFLOW_PROD_DB_HOST}:${TEAMFLOW_PROD_DB_PORT:5432}/${TEAMFLOW_PROD_DB_NAME}?sslmode=verify-full
spring.datasource.username=${TEAMFLOW_PROD_DB_USER}
spring.datasource.password=${TEAMFLOW_PROD_DB_PASSWORD}
spring.datasource.hikari.data-source-properties.sslrootcert=${TEAMFLOW_PROD_DB_SSL_ROOT_CERT}
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
server.servlet.session.cookie.secure=true
teamflow.attachments.storage-root=${TEAMFLOW_ATTACHMENT_STORAGE_ROOT}
