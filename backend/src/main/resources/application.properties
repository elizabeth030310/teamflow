
spring.application.name=teamflow
server.port=8081
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${TEAMFLOW_SESSION_COOKIE_SECURE:false}

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5433/teamflow
spring.datasource.username=teamflow
spring.datasource.password=${TEAMFLOW_DB_PASSWORD}

# JPA settings
spring.jpa.hibernate.ddl-auto=update

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
teamflow.attachments.storage-root=${TEAMFLOW_ATTACHMENT_STORAGE_ROOT:}
spring.jpa.show-sql=false
server.error.include-message=never
server.error.include-binding-errors=never

teamflow.signup.hmac-key=${TEAMFLOW_SIGNUP_HMAC_KEY:}
teamflow.signup.mail-provider=${TEAMFLOW_MAIL_PROVIDER:smtp}
teamflow.signup.mail-from=${TEAMFLOW_SMTP_FROM:}
teamflow.signup.brevo-api-key=${TEAMFLOW_BREVO_API_KEY:}
teamflow.signup.brevo-from=${TEAMFLOW_BREVO_FROM:${TEAMFLOW_SMTP_FROM:}}
spring.mail.host=${TEAMFLOW_SMTP_HOST:}
spring.mail.port=${TEAMFLOW_SMTP_PORT:587}
spring.mail.username=${TEAMFLOW_SMTP_USERNAME:}
spring.mail.password=${TEAMFLOW_SMTP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.debug=false
spring.mail.properties.mail.smtp.auth=${TEAMFLOW_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${TEAMFLOW_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${TEAMFLOW_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
