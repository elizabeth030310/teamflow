worker_processes 1;
pid /tmp/teamflow-nginx/nginx.pid;
error_log stderr;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    client_body_temp_path /tmp/teamflow-nginx/client;
    proxy_temp_path /tmp/teamflow-nginx/proxy;
    fastcgi_temp_path /tmp/teamflow-nginx/fastcgi;
    uwsgi_temp_path /tmp/teamflow-nginx/uwsgi;
    scgi_temp_path /tmp/teamflow-nginx/scgi;

    server {
        listen __PORT__;
        server_name _;
        root /app/public;
        client_max_body_size 11m;

        location = /healthz {
            access_log off;
            return 204;
        }

        location ~ ^/api(?:/|$) {
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-Prefix "";
            proxy_set_header X-Forwarded-Ssl "";
            proxy_read_timeout 75s;
            proxy_buffering off;
            proxy_cache off;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
